<ion-header class="header-bg" [translucent]="true">
  <ion-toolbar mode="ios">
    <ion-buttons>
      <ion-back-button defaultHref="/user-account" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title color="light">Change email</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <ion-grid>
    <ion-row>
      <ion-col size-md="6" offset-md="3">
        <form>
          <ion-card>
            <ion-card-header>
              Tape your new email and confirm it with your old email address
            </ion-card-header>
            <ion-card-content>
              <div class="form-group">
                <ion-label>Old email</ion-label>
                <ion-input type="email" class="form-control bg-light" inputmode="email"></ion-input>
              </div>
              <div class="form-group">
                <ion-label>New email</ion-label>
                <ion-input type="email" class="form-control bg-light" inputmode="email"></ion-input>
              </div>
            </ion-card-content>
          </ion-card>
          <div class="ion-padding-top">
            <ion-button type="submit" color="success" expand="block">Save</ion-button>
          </div>
        </form>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
