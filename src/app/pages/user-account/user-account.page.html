<app-header [title]="'user account'" [defaultBack]="'/tabs/tabs/tab5'"></app-header>

<ion-content color="light">
  <ion-grid>
    <ion-row>
      <ion-col size-md="6" offset-md="3">
        <ion-card>
          <ion-card-header>
            <ion-item-divider mode="ios">
              Details
            </ion-item-divider>
          </ion-card-header>
          <ion-card-content>
            <form [formGroup]="accountDetailForm" (ngSubmit)="onEdit()">
              <ion-list>
                <div class="form-group">
                  <ion-label>Prénom</ion-label>
                  <ion-input type="text" class="form-control bg-light" [(ngModel)]="user.firstName" formControlName="firstName"></ion-input>
                </div>
                <div class="form-group">
                  <ion-label>Nom</ion-label>
                  <ion-input type="text" class="form-control bg-light" [(ngModel)]="user.lastName" formControlName="lastName"></ion-input>
                </div>
                <div class="form-group">
                  <ion-label>Email</ion-label>
                  <ion-input type="text" inputmode="email" class="form-control bg-light" [(ngModel)]="user.email" formControlName="email" [disabled]="true"></ion-input>
                </div>
                <div class="form-group">
                  <ion-label>Numéro de téléphone</ion-label>
                  <div class="form-inline">
                    <ion-select value="216" formControlName="codeArea">
                      <ion-select-option value="216">+216</ion-select-option>
                      <ion-select-option value="242">+242</ion-select-option>
                      <ion-select-option>+337</ion-select-option>
                    </ion-select>
                    <ion-input type="text" class="form-control bg-light" [(ngModel)]="user.cellNumber" formControlName="cellNumber"></ion-input>
                  </div>
                </div>
              </ion-list>
              <div class="form-group">
                <ion-button color="success">Enregistrer</ion-button>
              </div>
            </form>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-list>
          <div *ngFor="let co of otherDetails; let i = index">
            <ion-item (click)="selectedIndex = i" lines="inset" routerDirection="root" [routerLink]="[co.url]" [class.selected]="selectedIndex == i">
              <ion-icon slot="start" [ios]="co.icon + '-outline'" [md]="co.icon + '-sharp'"></ion-icon>
              <ion-label>{{ co.title }}</ion-label>
            </ion-item>
          </div>
        </ion-list>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
