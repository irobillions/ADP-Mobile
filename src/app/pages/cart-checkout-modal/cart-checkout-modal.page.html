<div>
  <ion-toolbar mode="ios" class="ion-no-padding">
      <ion-title class="text-xs">Order Summary</ion-title>
      <ion-button fill="clear" color="dark" (click)="close()">
        <ion-icon name="close" slot="start"></ion-icon>
      </ion-button>
  </ion-toolbar>
</div>
<ion-content fullscreen color="light">
  <div class="ion-padding">
    <div *ngIf="cart.length !== 0">
      <ion-item *ngFor="let article of cart" class="ion-text-wrap card">
        <ion-grid class="ion-no-padding">
          <ion-row>
            <ion-col size="9">
              <p>{{ article.qty }}x </p>
              <b class="truncate">{{ article.item.productName }}</b>
            </ion-col>
            <ion-col size="3" class="ion-text-end">
             {{ article.amount | currency }}
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>
      <ion-item>
        <ion-grid>
          <ion-row>
            <ion-col size="9" class="text-gray-700">
              Delivery Cost
            </ion-col>
            <ion-col size="3" class="ion-text-end">
              {{ delivery }}
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6" class="text-gray-700">
              Total:
            </ion-col>
            <ion-col size="6" class="ion-text-end">
             {{ total | currency }}
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-item>
    </div>

    <ion-button expand="full" class="w-full bg-teal-500 text-white py-2" fill="clear" (click)="confirmCart()">
      confirm
    </ion-button>
  </div>

</ion-content>
