<div>
        <div class="flex flex-row mt-2 flex-none">
            <div class="mr-2">
                <svg fill="currentColor" class="w-3 h-3" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-6-3a2 2 0 11-4 0 2 2 0 014 0zm-2 4a5 5 0 00-4.546 2.916A5.986 5.986 0 0010 16a5.986 5.986 0 004.546-2.084A5 5 0 0010 11z"
                          clip-rule="evenodd" fill-rule="evenodd"/>
                </svg>
            </div>
            <div class="flex flex-col flex-grow">
                <div class="flex ion-justify-content-between">
                    <span class="bold serif">Loic Lari</span>
                    <div class="flex inline-flex pad-5 ion-justify-content-center">
                    <span class="inline-flex ion-justify-content-center ion-align-items-center pad-1 pr-1 pt-1">
                       {{ product.rating }}
                     </span>
                        <div class="span-container inline-flex ion-justify-content-center pad-5 pr-1">
                          <span *ngIf="product.rating >= 1">
                            <ion-icon class="iconStar" name="star"></ion-icon>
                          </span>
                            <span *ngIf="product.rating >= 2">
                            <ion-icon class="iconStar" name="star"></ion-icon>
                          </span>
                        <span *ngIf="product.rating >= 3">
                            <ion-icon class="iconStar" name="star"></ion-icon>
                          </span>
                            <span *ngIf="product.rating >= 4">
                                <ion-icon class="iconStar" name="star"></ion-icon>
                              </span>
                            <span *ngIf="product.rating >= 5">
                            <ion-icon class="iconStar" name="star"></ion-icon>
                          </span>
                        </div>
                    </div>
                </div>
                <div class="monospace">Il y a 2 mois</div>
                <div class="text-sm">
                    {{ comment.body }}
                </div>
            </div>
        </div>
</div>
