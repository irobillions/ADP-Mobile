<ion-header class="header-bg" [translucent]="true">
  <ion-toolbar mode="ios">
    <ion-back-button slot="start" defaultHref="{{ defaultBack }}" color="light"></ion-back-button>
    <ion-buttons slot="end" style="background-color: #70A9AC;">
      <ion-button class="button-cart-not-bg cart" color="dark" (click)="openCart()" #cart>
        <ion-badge class="cart-length" color="undefined">{{ cartItemCount | async }}</ion-badge>
        <ion-icon ios="cart-outline" md="cart-sharp" style="position: relative; font-size: 2em; background-color: #70A9AC"></ion-icon>
      </ion-button>
      <ion-button class="button-cart-not-bg not" color="dark" (click)="openNotificationModal()">
        <ion-icon ios="notifications-outline" md="notifications-sharp" style="position: relative; font-size: 1.6em; background-color: #70A9AC"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title color="light">{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>
